name: Generate and Send Fantasy Football Briefing

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic or Week for Fantasy Football news'
        required: true
        default: 'Fantasy Football Waiver Wire Targets and Injury Report'
      model:
        description: 'Gemini model to use'
        required: true
        default: 'gemini-3.1-pro-preview'

  schedule:
    - cron: '0 12 * * 2'

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Fetch and Summarize Fantasy Football News with Gemini
        id: generate_news
        env:
          MODEL: ${{ github.event.inputs.model || 'gemini-3.1-pro-preview' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic || 'Fantasy Football Waiver Wire Targets and Injury Report' }}
        run: |
          # 1. Query Gemini API
          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d '{
              "system_instruction": {
                "parts": [
                  {
                    "text": "You are an elite fantasy football analyst. Write a clean, highly actionable email briefing tailored for fantasy managers making Tuesday waiver decisions. DO NOT include inline search citation numbers or brackets like [1.2] or [1.3.3] in the text. DO NOT include a Subject line or title header. Jump straight into the content using Markdown section headers: 1. Top Waiver Wire Targets, 2. Major Injury Updates, 3. Streamers, and 4. Drops."
                  }
                ]
              },
              "contents": [
                {
                  "parts": [
                    {
                      "text": "Gather latest NFL updates and waiver wire recommendations for '"${TOPIC}"'."
                    }
                  ]
                }
              ],
              "tools": [
                {
                  "google_search": {}
                }
              ],
              "generationConfig": {
                "temperature": 0.3,
                "maxOutputTokens": 4096
              }
            }')

          # 2. Extract ALL text parts safely while skipping non-text parts
          RAW_MARKDOWN=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[]? | select(.text != null) | .text')

          if [ -z "$RAW_MARKDOWN" ] || [ "$RAW_MARKDOWN" == "null" ]; then
            echo "::error::Failed to generate email content. Raw API response was: $RESPONSE"
            exit 1
          fi

          # 3. Save raw markdown to a file
          echo "$RAW_MARKDOWN" > raw_briefing.md

          # 4. Convert Markdown to HTML with Pandoc
          pandoc raw_briefing.md -f markdown -t html -o email_body.html

      - name: Send Email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🏈 Fantasy Football Tuesday Waiver & News Briefing"
          to: ${{ vars.EMAIL }}
          from: "Football God <${{ secrets.MAIL_USERNAME }}>"

          # Uses the exact parameter key required for HTML files
          html_body: file://email_body.html