name: Generate and Send Fantasy Football Briefing

on:
  # Allows triggering the workflow manually from the Actions tab with a custom week or topic
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic or Week for Fantasy Football news'
        required: true
        default: 'Fantasy Football Waiver Wire Targets and Injury Report'

  # Runs every Tuesday at 8:00 AM EDT / 7:00 AM EST (UTC 12:00)
  schedule:
    - cron: '0 12 * * 2'

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Fetch and Summarize Fantasy Football News with Gemini
        id: generate_news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic || 'Fantasy Football Waiver Wire Targets and Injury Report' }}
        run: |
          # 1. Query Gemini API with Google Search Grounding enabled
          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-pro-preview:generateContent?key=${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d '{
              "system_instruction": {
                "parts": [
                  {
                    "text": "You are an elite fantasy football analyst. Write a clean, highly actionable email briefing tailored for fantasy managers making Tuesday waiver decisions. DO NOT include a Subject line or title header. Jump straight into the content using Markdown section headers: 1. Top Waiver Wire Targets, 2. Major Injury Updates, 3. Streamers, and 4. Drops."
                  }
                ]
              },
              "contents": [
                {
                  "parts": [
                    {
                      "text": "Gather latest NFL updates and waiver wire recommendations for '"${TOPIC}"'."
                    }
                  ]
                }
              ],
              "tools": [
                {
                  "google_search": {}
                }
              ],
              "generationConfig": {
                "temperature": 0.3,
                "maxOutputTokens": 4096
              }
            }')

          # 2. Concatenate all text parts returned by Gemini
          RAW_MARKDOWN=$(echo "$RESPONSE" | jq -r '[.candidates[0].content.parts[].text] | join("")')

          if [ -z "$RAW_MARKDOWN" ] || [ "$RAW_MARKDOWN" == "null" ]; then
            echo "::error::Failed to generate email content. Response was: $RESPONSE"
            exit 1
          fi

          # 3. Save to file and convert Markdown to HTML via Pandoc
          echo "$RAW_MARKDOWN" > raw_briefing.md
          pandoc raw_briefing.md -f markdown -t html -o email_body.html

      - name: Send Email
        uses: dawidd6/action-send-mail@v4
        with:
          # SMTP Server Configuration
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          # Authentication Secrets (Must use a 16-character Google App Password)
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          # Email Details
          subject: "🏈 Fantasy Football Tuesday Waiver & News Briefing"
          to: ${{ vars.EMAIL }}
          from: "Football God <${{ secrets.MAIL_USERNAME }}>"

          # Points to the HTML converted file
          html_body: file://email_body.html